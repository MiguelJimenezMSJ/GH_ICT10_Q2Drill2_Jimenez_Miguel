<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Drill2</title>
        <style>
    body {
        font-family: Georgia, 'Times New Roman', serif;
        background-color: #c2c2c2;
        color: #f4556f;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 8px;
        background-color: #f4556f;
    }

    form {
        background-color: #ffffff;
        width: 350px;
        max-width: calc(100% - 64px);
        padding: 35px;
        border: 1px solid #e8c7cf;
        border-top: 5px solid #f4556f;
        border-radius: 10px;
        box-shadow: 0 8px 25px rgba(91, 30, 49, 0.12);
        text-align: center;
    }

    form::before {
        content: "STUDENT CLUB DIRECTORY";
        display: block;
        color: #5c5b5b;
        font-size: 21px;
        font-weight: bold;
        letter-spacing: 1px;
        margin-bottom: 10px;
    }

    form::after {
        content: "Student Information Search";
        display: block;
        color: #a87985;
        font-size: 14px;
        font-style: italic;
        margin-top: 18px;
    }

    input[type="text"] {
        box-sizing: border-box;
        width: 100%;
        padding: 13px;
        margin: 10px 0;
        border: 1px solid #dfbdc7;
        border-radius: 5px;
        background-color: #fffafa;
        color: #43232d;
        font-family: Arial, sans-serif;
        font-size: 14px;
        outline: none;
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    input[type="text"]:focus {
        border-color: #8b1e3f;
        box-shadow: 0 0 5px rgba(139, 30, 63, 0.2);
    }

    input[type="text"]::placeholder {
        color: #b49aa2;
    }

    input[type="button"] {
        width: 100%;
        padding: 13px;
        margin-top: 12px;
        border: none;
        border-radius: 5px;
        background-color: #f4556f;
        color: #f5f3f3;
        font-size: 15px;
        font-weight: bold;
        letter-spacing: 1px;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.2s;
    }

    input[type="button"]:hover {
        background-color: #8b1e3f;
        transform: translateY(-2px);
    }

    #result {
        box-sizing: border-box;
        width: 420px;
        max-width: calc(100% - 40px);
        margin-top: 25px;
        padding: 20px;
        background-color: #ffffff;
        border-left: 4px solid #00b43f;
        border-radius: 5px;
        box-shadow: 0 4px 15px rgba(91, 30, 49, 0.08);
        color: #5c5b5b;
        line-height: 1.6;
        overflow-wrap: anywhere;
    }
</style>
</head>
<body>
    <form>
    <input type="text" id="First_name" placeholder="Enter First name"><br>
    <input type="text" id="Last_name" placeholder="Enter Last name"> <br> 
    <input type="button" py-click="student_club" value="Search">
    </form>
<div id="result"></div>
<py-script src="main.py"></py-script>
</body>
</html>
